[workspace]
members = ["crates/*", "apps/glyph-demo"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
glam = { version = "=0.34.2", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
noise = "=0.9.0"
turn-system = { path = "crates/turn-system" }
world-generation = { path = "crates/world-generation" }
game-core = { path = "crates/game-core" }
game-assets = { path = "crates/game-assets" }
ascii-renderer = { path = "crates/ascii-renderer" }
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11", "android-native-activity"] }
bytemuck = { version = "=1.25.2", features = ["derive"] }
pollster = "=0.4.0"

[profile.dev]
debug = 1

# Símbolos completos en el código propio; dependencias y build scripts conservan
# sus perfiles ligeros. Añadir aquí futuros crates del workspace que se deban depurar.
[profile.dev.package.game-core]
debug = 2

[profile.dev.package.turn-system]
debug = 2

[profile.dev.package.world-generation]
debug = 2

[profile.dev.package.game-assets]
debug = 2

[profile.dev.package.ascii-renderer]
debug = 2

[profile.dev.package.glyph-demo]
debug = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
