[workspace]
members = ["crates/game-core", "crates/turn-system", "crates/world-generation"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
glam = { version = "=0.34.2", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
noise = "=0.9.0"
turn-system = { path = "crates/turn-system" }
world-generation = { path = "crates/world-generation" }
game-core = { path = "crates/game-core" }

[profile.dev]
debug = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
