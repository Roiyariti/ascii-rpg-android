plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.roiyariti.asciirpg'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId 'io.github.roiyariti.asciirpg'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-hito-a'
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('../.local/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { jniDebuggable true }
        release { minifyEnabled false }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
}

// Cargo es la fuente única de la biblioteca nativa.
tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir.parentFile
    commandLine 'sh', 'scripts/build-android.sh', '--library-only'
}
tasks.named('preBuild').configure { dependsOn 'buildRust' }
