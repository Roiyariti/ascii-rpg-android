name: Verificación
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Rust fijado por el proyecto
        run: rustup show
      - name: Bibliotecas de ventana y GPU software
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev libxkbcommon-dev libvulkan1 mesa-vulkan-drivers
      - run: python3 scripts/check-repository.py
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --locked
      - name: Comprobar shader y cobertura mediante lectura GPU
        env:
          WGPU_BACKEND: vulkan
          XDG_RUNTIME_DIR: /tmp
        run: |
          for icd in /usr/share/vulkan/icd.d/*lvp*.json; do
            if [ -f "$icd" ]; then
              export VK_ICD_FILENAMES="$icd"
              break
            fi
          done
          test -f "$VK_ICD_FILENAMES"
          cargo run --locked -p ascii-renderer --example gpu-smoke
          cargo run --locked -p glyph-demo --example world-snapshot -- target/world-a-42.ppm 42
          cargo run --locked -p glyph-demo --example world-snapshot -- target/world-a-73.ppm 73
      - uses: actions/upload-artifact@v4
        with:
          name: ascii-world-a-captures
          path: target/world-a-*.ppm
          if-no-files-found: error
          retention-days: 7
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Instalar SDK y NDK fijados
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - run: rustup show
      - name: Compilar biblioteca ARM64 y APK de prueba
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358" sh scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ascii-rpg-debug-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
